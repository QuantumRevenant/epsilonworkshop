services:
  postgres:
    image: postgres:16
    container_name: taller_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taller_automotriz
      POSTGRES_USER: taller_user
      POSTGRES_PASSWORD: taller_pass
    ports:
      - "5432:5432"
    volumes:
      - taller_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  taller_pgdata:
