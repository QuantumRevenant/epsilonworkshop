name: epsilonworkshop
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: epsilonworkshop
      POSTGRES_USER: epsilonworkshop_user
      POSTGRES_PASSWORD: epsilonworkshop_pass
    ports:
      - "5432:5432"
    volumes:
      - epsilonworkshop_pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

volumes:
  epsilonworkshop_pgdata:
